# Dependabot updates of main dependencies
# Updates are aprox monthly, since site is small and static
# but security updates can come immdiatley
version: 2
updates:
  # Web app packages (npm / yarn)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      web:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]

  # Docker base images (Dockerfile)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"
    labels: ["dependencies"]
